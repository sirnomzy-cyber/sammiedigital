<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio | SammieDigital — Onome Ahorituwere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[data-theme="dark"]{--bg:#020617;--bg2:#0F172A;--bg3:#1E293B;--text:#FFFFFF;--muted:#94A3B8;--border:rgba(59,130,246,0.15);--border2:rgba(255,255,255,0.08)}
[data-theme="light"]{--bg:#F8F9FB;--bg2:#FFFFFF;--bg3:#F1F5F9;--text:#0F172A;--muted:#64748B;--border:rgba(59,130,246,0.12);--border2:rgba(0,0,0,0.08)}
:root{--accent:#3B82F6;--accent2:#60A5FA;--radius:16px;--font-display:'Cormorant Garamond',serif;--font-body:'DM Sans',sans-serif}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1rem 3rem;display:flex;align-items:center;justify-content:space-between;background:rgba(2,6,23,0.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border2)}
.nav-logo{font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--text);text-decoration:none}
.nav-logo span{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:1rem}
.theme-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.3s}
.back-btn{background:var(--accent);color:#fff;padding:0.6rem 1.25rem;border-radius:4px;font-size:0.82rem;font-weight:600;text-decoration:none;transition:all 0.2s}
.back-btn:hover{background:var(--accent2)}

/* HERO */
.port-hero{padding:8rem 3rem 4rem;text-align:center;border-bottom:1px solid var(--border2)}
.port-label{font-size:0.7rem;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;display:flex;align-items:center;justify-content:center;gap:0.75rem}
.port-label::before,.port-label::after{content:'';width:24px;height:1px;background:var(--accent)}
.port-title{font-family:var(--font-display);font-size:clamp(2.5rem,6vw,5rem);font-weight:700;line-height:1.05;letter-spacing:-0.02em;margin-bottom:1rem}
.port-title em{font-style:italic;font-weight:400;color:var(--accent2)}
.port-sub{color:var(--muted);font-size:1rem;font-weight:300;max-width:500px;margin:0 auto}

/* FILTERS */
.filters{padding:2.5rem 3rem;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0.75rem;max-width:1200px;margin:0 auto}
.filter-btn{background:var(--bg2);border:1px solid var(--border2);color:var(--muted);padding:0.5rem 1.25rem;border-radius:50px;font-size:0.8rem;font-weight:500;cursor:pointer;transition:all 0.2s;font-family:var(--font-body)}
.filter-btn:hover,.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* GRID */
.port-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem;max-width:1200px;margin:0 auto;padding:0 3rem 6rem}
.port-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;transition:all 0.3s;cursor:pointer}
.port-card:hover{transform:translateY(-4px);border-color:rgba(59,130,246,0.25);box-shadow:0 16px 40px rgba(0,0,0,0.15)}
.port-card.hidden{display:none}
.port-img{aspect-ratio:16/9;position:relative;overflow:hidden;background:var(--bg3)}
.port-img iframe{position:absolute;top:0;left:0;width:250%;height:250%;border:none;transform:scale(0.4);transform-origin:top left;pointer-events:none}
.port-overlay{position:absolute;inset:0;background:rgba(59,130,246,0.88);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s;font-size:0.8rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#fff;text-decoration:none}
.port-card:hover .port-overlay{opacity:1}
.port-body{padding:1.5rem}
.port-tags{display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.75rem}
.port-tag{font-size:0.65rem;background:rgba(59,130,246,0.07);border:1px solid rgba(59,130,246,0.12);color:var(--accent2);padding:0.2rem 0.55rem;border-radius:3px;text-transform:uppercase;letter-spacing:0.05em}
.port-title-card{font-family:var(--font-display);font-size:1.15rem;font-weight:600;color:var(--text);margin-bottom:0.4rem}
.port-desc{font-size:0.82rem;color:var(--muted);line-height:1.7;font-weight:300}
.port-meta{display:flex;gap:1.5rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border2)}
.port-meta strong{display:block;font-size:0.72rem;font-weight:600;color:var(--text);margin-bottom:0.1rem}
.port-meta span{font-size:0.7rem;color:var(--muted)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:4rem;color:var(--muted);grid-column:1/-1;display:none}
.empty-state.show{display:block}

/* RESPONSIVE */
@media(max-width:768px){nav{padding:1rem 1.5rem}.port-hero{padding:7rem 1.5rem 3rem}.filters{padding:2rem 1.5rem}.port-grid{padding:0 1.5rem 4rem;grid-template-columns:1fr}}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Sammie<span>Digital</span></a>
  <div class="nav-right">
    <button class="theme-btn" id="themeBtn" title="Toggle theme">☀️</button>
    <a href="index.html" class="back-btn">← Back to Home</a>
  </div>
</nav>

<div class="port-hero">
  <div class="port-label">Selected Works</div>
  <h1 class="port-title">20+ Projects.<br><em>Every One Delivered.</em></h1>
  <p class="port-sub">A curated collection of websites, funnels, landing pages, and digital experiences delivered for clients across Nigeria, the US, the UK, and beyond.</p>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All Projects</button>
  <button class="filter-btn" data-filter="E-commerce">E-commerce</button>
  <button class="filter-btn" data-filter="Website">Website</button>
  <button class="filter-btn" data-filter="Landing Page">Landing Page</button>
  <button class="filter-btn" data-filter="Funnel">Funnel</button>
  <button class="filter-btn" data-filter="Food">Food & Dining</button>
  <button class="filter-btn" data-filter="Events">Events</button>
  <button class="filter-btn" data-filter="SaaS">SaaS</button>
  <button class="filter-btn" data-filter="Legal">Legal</button>
  <button class="filter-btn" data-filter="Blog">Blog</button>
</div>

<div class="port-grid" id="portGrid">
  <div class="empty-state" id="emptyState">No projects in this category yet.</div>
</div>

<script>
var allProjects = [
  {url:'https://tasteescookies.com/',tags:['E-commerce','Shopify'],title:"Tastee's Cookies",desc:"Full Shopify e-commerce build covering product uploads, domain connection, custom design, and post-launch support for a Nigerian cookie brand.",p:'Shopify',t:'E-commerce'},
  {url:'https://rachelperry-blog.vercel.app/',tags:['Blog','Lifestyle'],title:'Rachel Perry Lifestyle Blog',desc:'Personal lifestyle blog featuring dark mode, scroll animations, affiliate link integration, and a hero slideshow. Deployed on Vercel via GitHub.',p:'Vercel / GitHub',t:'Blog'},
  {url:'https://carepoint-medical-center.vercel.app/',tags:['Health','Landing Page'],title:'CarePoint Medical Center',desc:'Professional healthcare landing page with appointment booking, services overview, and conversion-focused layout for a medical practice.',p:'HTML / CSS / JS',t:'Landing Page'},
  {url:'https://celestia-cove-resort.vercel.app/',tags:['Real Estate','Landing Page'],title:'Celestia Cove Resort',desc:'High-converting real estate landing page with immersive property showcase, amenities section, and integrated lead capture for a luxury resort.',p:'HTML / CSS / JS',t:'Landing Page'},
  {url:'https://marluscious-bite.vercel.app/',tags:['Food & Bakery','Website'],title:'Marluscious Bite',desc:'Elegant cake baking website with full menu showcase, custom order section, gallery, and brand identity built for a premium bakery business.',p:'HTML / CSS / JS',t:'Website'},
  {url:'https://titan-build-construction-group.vercel.app/',tags:['Construction','Website'],title:'Titan Build Construction Group',desc:'Premium construction company website featuring project portfolio, services, team section, and a bold editorial design with strong visual impact.',p:'HTML / CSS / JS',t:'Website'},
  {url:'https://velvora-luxury-fashion.vercel.app/',tags:['E-commerce','Fashion'],title:'Velvora Luxury Fashion',desc:'High-end luxury fashion e-commerce website with elegant product displays, editorial-style layout, and a premium shopping experience.',p:'Shopify',t:'E-commerce'},
  {url:'https://david-kingsley.vercel.app/',tags:['Personal Brand','Landing Page'],title:'David Kingsley',desc:'Sleek personal brand landing page designed to position and promote an individual professional with a strong visual identity and clear CTA.',p:'HTML / CSS / JS',t:'Landing Page'},
  {url:'https://ijebu-spice-lounge.vercel.app/',tags:['Food & Dining','Website'],title:'Ijebu Spice Lounge',desc:'Vibrant restaurant website for a Nigerian dining experience featuring menu showcase, ambiance photography, and reservation integration.',p:'WordPress',t:'Website'},
  {url:'https://vela-restuarant.vercel.app/',tags:['Food & Dining','Website'],title:'Vela Restaurant',desc:'Sophisticated restaurant website with online menu, about story, gallery, and booking functionality built for an upscale dining brand.',p:'WordPress',t:'Website'},
  {url:'https://westmidlands-research-report.vercel.app/',tags:['Education','Landing Page'],title:'West Midlands School Research',desc:'Clean academic-style landing page presenting a school research report with structured data sections and professional presentation layout.',p:'HTML / CSS / JS',t:'Landing Page'},
  {url:'https://harrison-and-cole-attorneys.vercel.app/',tags:['Legal','Website'],title:'Harrison & Cole Attorneys',desc:'Professional law firm website conveying trust and authority with practice areas, attorney profiles, and consultation request functionality.',p:'HTML / CSS / JS',t:'Website'},
  {url:'https://future-x-global-summit.vercel.app/',tags:['Events','Funnel'],title:'Future X Global Summit',desc:'High-converting event registration funnel for a global summit, featuring speaker lineup, schedule, countdown timer, and ticket purchase flow.',p:'GoHighLevel',t:'Funnel'},
  {url:'https://iron-haven-fitness-club.vercel.app/',tags:['Fitness','Landing Page'],title:'Iron Haven Fitness Club',desc:'Energetic fitness club landing page with membership plans, class schedules, trainer profiles, and a strong conversion-focused layout.',p:'GoHighLevel',t:'Landing Page'},
  {url:'https://azure-pearl-resort.vercel.app/',tags:['Hospitality','Website'],title:'Azure Pearl Resort',desc:'Luxury resort website with immersive full-screen visuals, amenities showcase, room gallery, and integrated booking experience.',p:'WordPress',t:'Website'},
  {url:'https://flow-sync-ai-ochre.vercel.app/',tags:['SaaS','Landing Page'],title:'FlowSync AI',desc:'Modern SaaS landing page for an AI productivity tool featuring feature highlights, pricing tiers, testimonials, and a free trial CTA.',p:'HTML / CSS / JS',t:'Landing Page'},
  {url:'https://titan-build-construction-group-h3sg.vercel.app/',tags:['Construction','Website'],title:'Titan Build Construction Group v2',desc:'Updated version of the Titan Build construction company website with enhanced project portfolio and refreshed design.',p:'HTML / CSS / JS',t:'Website'},
  {url:'https://future-x-kohl.vercel.app/',tags:['Events','Website'],title:'Future X Events',desc:'Dynamic events website showcasing upcoming and past events, speaker features, and an engaging registration flow for a recurring events brand.',p:'HTML / CSS / JS',t:'Website'},
  {url:'https://crumble-cookie-brand.vercel.app/',tags:['E-commerce','Food & Bakery'],title:'Crumble Cookie',desc:'Playful and conversion-optimised Shopify e-commerce store for a cookie brand, featuring product collections, custom packaging options, and seamless checkout.',p:'Shopify',t:'E-commerce'},
  {url:'https://maison-crumb-b2xk.vercel.app/',tags:['E-commerce','Food & Bakery'],title:'Maison Crumb',desc:'Premium artisan bakery e-commerce website with elegant product presentation, custom order capability, and a refined brand aesthetic.',p:'Shopify',t:'E-commerce'}
];

var cardColors = [
  'linear-gradient(135deg,#0F4C81,#1a6fa8)',
  'linear-gradient(135deg,#1a1a2e,#16213e)',
  'linear-gradient(135deg,#0d3b2e,#1a5c45)',
  'linear-gradient(135deg,#2d1b4e,#4a2d7a)',
  'linear-gradient(135deg,#4a1942,#7b2d6e)',
  'linear-gradient(135deg,#1a2a1a,#2d4a1e)'
];

function renderProjects(projects) {
  var grid = document.getElementById('portGrid');
  var empty = document.getElementById('emptyState');
  var existing = grid.querySelectorAll('.port-card');
  for (var i = 0; i < existing.length; i++) existing[i].remove();
  if (projects.length === 0) { empty.classList.add('show'); return; }
  empty.classList.remove('show');

  var fallbackColors = ['#0F4C81','#1a1a2e','#0d3b2e','#2d1b4e','#4a1942','#1a2a1a','#1a2a3a','#2a1a0d','#0d2a1a','#2a0d1a','#1a0d2a','#2a2a0d','#0d1a2a','#1a2a0d','#2a0d2a','#0d2a2a','#1a1a1a','#2a1a2a','#0d0d2a','#2a2a1a'];

  projects.forEach(function(p, idx) {
    var tags = p.tags.map(function(t) { return '<span class="port-tag">' + t + '</span>'; }).join('');
    var isVercel = p.url.indexOf('vercel.app') !== -1;
    var colorIdx = idx % fallbackColors.length;

    var card = document.createElement('div');
    card.className = 'port-card';

    var imgWrap = document.createElement('div');
    imgWrap.className = 'port-img';
    imgWrap.style.background = fallbackColors[colorIdx];
    imgWrap.style.position = 'relative';
    imgWrap.style.overflow = 'hidden';

    if (isVercel) {
      var iframe = document.createElement('iframe');
      iframe.src = p.url;
      iframe.loading = 'lazy';
      iframe.scrolling = 'no';
      iframe.setAttribute('title', p.title);
      iframe.style.cssText = 'position:absolute;top:0;left:0;width:250%;height:250%;border:none;transform:scale(0.4);transform-origin:top left;pointer-events:none';
      imgWrap.appendChild(iframe);
    } else {
      var img = document.createElement('img');
      img.alt = p.title;
      img.loading = 'lazy';
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;object-position:top;position:absolute;top:0;left:0';
      img.src = 'https://image.thum.io/get/width/1280/crop/800/noanimate/' + p.url;
      img.onerror = (function(wrap, title) {
        return function() {
          this.style.display = 'none';
          var lbl = document.createElement('div');
          lbl.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:serif;font-size:1rem;font-weight:600;color:rgba(255,255,255,0.8);text-align:center;width:80%;padding:1rem';
          lbl.textContent = title;
          wrap.appendChild(lbl);
        };
      })(imgWrap, p.title);
      imgWrap.appendChild(img);
    }

    var overlay = document.createElement('a');
    overlay.href = p.url;
    overlay.target = '_blank';
    overlay.className = 'port-overlay';
    overlay.textContent = 'View Live Site →';
    imgWrap.appendChild(overlay);

    var body = document.createElement('div');
    body.className = 'port-body';
    body.innerHTML = '<div class="port-tags">' + tags + '</div><h3 class="port-title-card">' + p.title + '</h3><p class="port-desc">' + p.desc + '</p><div class="port-meta"><div><strong>Platform</strong><span>' + p.p + '</span></div><div><strong>Type</strong><span>' + p.t + '</span></div></div>';

    card.appendChild(imgWrap);
    card.appendChild(body);
    grid.appendChild(card);
  });
}

// Filter logic
document.getElementById('filters').addEventListener('click', function(e) {
  if (!e.target.classList.contains('filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  e.target.classList.add('active');
  var filter = e.target.dataset.filter;
  if (filter === 'all') { renderProjects(allProjects); return; }
  var filtered = allProjects.filter(function(p){
    return p.tags.some(function(t){ return t.toLowerCase().includes(filter.toLowerCase()); }) || p.t.toLowerCase().includes(filter.toLowerCase());
  });
  renderProjects(filtered);
});

renderProjects(allProjects);

// Theme toggle
var isDark = true;
document.getElementById('themeBtn').addEventListener('click', function(){
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  this.textContent = isDark ? '☀️' : '🌙';
});
</script>
</body>
</html>
